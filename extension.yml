schema_version: "1.0"

extension:
  id: "echelon"
  name: "Echelon"
  version: "0.9.1"
  description: "Multi-agent cognitive system: 7-layer, 41-agent architecture with adversarial critic (SAGE), kill gate (GATEKEEPER), role-separation enforcement, cross-run calibration learning per-agent injection, full 34-metric Understanding integration, expert persona prompts, brownfield support via GOLDDIGGER, and RADAR real-time monitoring"
  author: "Ladislav Bihari"
  repository: "https://github.com/B3Cognition/echelon"
  license: "MIT"
  homepage: "https://github.com/B3Cognition/echelon"

requires:
  speckit_version: ">=0.4.2"
  skills:
    # Core spec-kit skills — validated at install time via `specify extension add echelon`
    - name: "speckit.specify"
      required: true
      required_for: "CARTOGRAPHER — spec creation and branch setup"
      hard_stop: true
    - name: "speckit.constitution"
      required: true
      required_for: "constitution creation and amendment (ARCHITECT, COMMANDER)"
    - name: "speckit.plan"
      required: true
      required_for: "ARCHITECT — technical plan generation"
    - name: "speckit.tasks"
      required: true
      required_for: "ORCHESTRATOR — task decomposition"
    - name: "speckit.implement"
      required: true
      required_for: "IMPLEMENTER — task execution orchestration"
    - name: "speckit.clarify"
      required: false
      required_for: "CARTOGRAPHER — optional spec Q&A"
    - name: "speckit.analyze"
      required: false
      required_for: "ORCHESTRATOR — cross-artifact consistency check"
  tools:
    - name: "understanding"
      version: ">=3.8.0"
      required_for: "WHY2, WHY3 (spec-validation)"
      hard_stop: true
      note: "System CLI at ~/.local/bin/understanding. HARD STOP if unavailable for WHY2/WHY3 — heuristic fallback proven 15-29% overconfident (PAT-006). WHY1 (assumption-challenge) does not require it."
    - name: "revenge"
      version: ">=3.0.0"
      required: false
      # Integration: invoked via GOLDDIGGER agent (Skill tool), not as a CLI binary.

provides:
  commands:
    - name: "speckit.echelon.run"
      file: "commands/echelon.run.md"
      description: "Full autonomous cognitive squad run"
    - name: "speckit.echelon.build"
      file: "commands/echelon.build.md"
      description: "Execute the building phase — implement tasks with role-based agents"
    - name: "speckit.echelon.status"
      file: "commands/echelon.status.md"
      description: "Check current squad state and progress"
    - name: "speckit.echelon.innovate"
      file: "commands/echelon.innovate.md"
      description: "Manually trigger INNOVATE specialist"
    - name: "speckit.echelon.investigate"
      file: "commands/echelon.investigate.md"
      description: "Manually trigger SCIENTIST for a specific question"
    - name: "speckit.echelon.ground"
      file: "commands/echelon.ground.md"
      description: "Manually trigger reality check on artifacts"
    - name: "speckit.echelon.feedback"
      file: "commands/echelon.feedback.md"
      description: "Post-implementation feedback intake"
    - name: "speckit.echelon.resume"
      file: "commands/echelon.resume.md"
      description: "Provide answer to human escalation"
    - name: "speckit.echelon.change"
      file: "commands/echelon.change.md"
      description: "Handle specification change during build phase"
    - name: "speckit.echelon.verify"
      file: "commands/echelon.verify.md"
      description: "Run full backpropagation verification — 100% spec coverage check"
    - name: "speckit.echelon.health"
      file: "commands/echelon.health.md"
      description: "Periodic health check — spec-code drift, estimate drift, KB freshness"

    # ── Agent Definitions ──────────────────────────────────────────
    # Control layer
    - name: "speckit.echelon.commander"
      file: "agents/control/commander.md"
      description: "COMMANDER — principal orchestrator for all echelon phases"
      behavior:
        execution: agent
        capability: strong
        tools: full          # needs Bash (state-backup.sh) + Write (journal, state.json)
        color: blue
    - name: "speckit.echelon.checkpoint"
      file: "agents/control/checkpoint.md"
      description: "CHECKPOINT — internalization quality assessor"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes internalization-report.md
        color: blue
    - name: "speckit.echelon.scorekeeper"
      file: "agents/control/scorekeeper.md"
      description: "SCOREKEEPER — tracks and scores agent performance"
      behavior:
        execution: agent
        capability: balanced
        tools: write         # writes agent-scorecard.md, agent-scores.yaml
        color: blue
    - name: "speckit.echelon.strategist"
      file: "agents/control/strategist.md"
      description: "STRATEGIST — risk-weighted alignment advisor for COMMANDER"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes strategic-overview.md
        color: blue
    - name: "speckit.echelon.tracker"
      file: "agents/control/tracker.md"
      description: "TRACKER — intent analyst detecting scope drift"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes user-intent.md
        color: blue
    # Exploration layer
    - name: "speckit.echelon.scout"
      file: "agents/exploration/scout.md"
      description: "SCOUT — reconnaissance analyst mapping domain territory"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes glossary.md, mental-model.md, boundaries.md, assumptions.md, unknowns.md, reference-architectures.md
        color: green
    - name: "speckit.echelon.golddigger"
      file: "agents/exploration/golddigger.md"
      description: "GOLDDIGGER — brownfield extraction driver via revenge extension"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes brownfield-index.md, golddigger-cache/
        color: green
    - name: "speckit.echelon.synthesizer"
      file: "agents/exploration/synthesizer.md"
      description: "SYNTHESIZER — fuses raw discovery outputs into unified knowledge base"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes contradictions-and-gaps.md, risks.md, unified outputs
        color: green
    - name: "speckit.echelon.cartographer"
      file: "agents/exploration/cartographer.md"
      description: "CARTOGRAPHER — transforms domain understanding into testable specifications"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes spec.md, 00-overview.md (via Skill + direct)
        color: green
    - name: "speckit.echelon.sage"
      file: "agents/exploration/sage.md"
      description: "SAGE — adversarial critic and requirements quality gatekeeper"
      behavior:
        execution: agent
        capability: strong
        tools: full          # needs Bash to run `understanding` CLI in WHY2/WHY3
        color: green
    - name: "speckit.echelon.modeler"
      file: "agents/exploration/modeler.md"
      description: "MODELER — maintains living queryable map of the codebase"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes mental-model-code.md, invariant alerts
        color: green
    # Feasibility layer
    - name: "speckit.echelon.gatekeeper"
      file: "agents/feasibility/gatekeeper.md"
      description: "GATEKEEPER — kill gate for project feasibility and RICE scoring"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes feasibility.md, prioritization.md, estimates.md, mvp-scope.md
        color: orange
    - name: "speckit.echelon.validator"
      file: "agents/feasibility/validator.md"
      description: "VALIDATOR — internalization gate ensuring comprehension before work"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes internalization-report.md
        color: orange
    # Solution layer
    - name: "speckit.echelon.architect"
      file: "agents/solution/architect.md"
      description: "ARCHITECT — designs system structure and makes technology decisions"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes plan.md, research.md, data-model.md, contracts/
        color: purple
    - name: "speckit.echelon.orchestrator"
      file: "agents/solution/orchestrator.md"
      description: "ORCHESTRATOR — decomposes projects into executable task sequences"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes tasks.md, critical-path.md, risk-matrix.md, dependencies.md
        color: purple
    - name: "speckit.echelon.sentinel"
      file: "agents/solution/sentinel.md"
      description: "SENTINEL — test architecture lead designing test strategies"
      behavior:
