        tools: write         # writes patterns.yaml, pitfalls.yaml, knowledge-transfer-assessment.md
        color: yellow
    - name: "speckit.echelon.monitor"
      file: "agents/learning/monitor.md"
      description: "MONITOR — metacognition watchdog asking if the squad is still on track"
      behavior:
        execution: agent
        capability: balanced
        tools: write         # writes metacognition-log.md
        color: yellow
    - name: "speckit.echelon.veteran"
      file: "agents/learning/veteran.md"
      description: "VETERAN — cross-project knowledge curator managing patterns and pitfalls"
      behavior:
