schema_version: "1.0"

extension:
  id: "cognitive-squad"
  name: "Cognitive Squad"
  version: "0.4.0"
  description: "Multi-agent cognitive system v0.4: 7-layer, 35-agent architecture with adversarial critic (SAGE), kill gate (GATEKEEPER), role-separation enforcement, cross-run calibration learning, brownfield support, and RADAR real-time monitoring"
  author: "Testimonial"
  repository: "https://github.com/Testimonial/cognitive-squad"
  license: "MIT"

requires:
  speckit_version: ">=0.3.0"
  tools:
    - name: "understanding"
      version: ">=3.4.0"
      required_for: "WHY2, WHY3 (spec-validation)"
      hard_stop: true
      note: "System CLI at ~/.local/bin/understanding. HARD STOP if unavailable for WHY2/WHY3 — heuristic fallback proven 15-29% overconfident (PAT-006). WHY1 (assumption-challenge) does not require it."
  skills:
    - name: "speckit.reverse-eng.extract"
      required_for: brownfield
      hard_stop: true
      note: "Claude Code skill, not a CLI tool. Invoked via Skill tool. HARD STOP if unavailable in brownfield mode — no manual fallback."
    - name: "speckit.reverse-eng.analyze"
      required_for: brownfield
      hard_stop: true
      note: "Claude Code skill, not a CLI tool. Invoked via Skill tool."

provides:
  commands:
    - name: "speckit.squad.run"
      file: "commands/squad.run.md"
      description: "Full autonomous cognitive squad run"
    - name: "speckit.squad.build"
      file: "commands/squad.build.md"
      description: "Execute the building phase — implement tasks with role-based agents"
    - name: "speckit.squad.status"
      file: "commands/squad.status.md"
      description: "Check current squad state and progress"
    - name: "speckit.squad.innovate"
      file: "commands/squad.innovate.md"
      description: "Manually trigger INNOVATE specialist"
    - name: "speckit.squad.investigate"
      file: "commands/squad.investigate.md"
      description: "Manually trigger SCIENTIST for a specific question"
    - name: "speckit.squad.ground"
      file: "commands/squad.ground.md"
      description: "Manually trigger reality check on artifacts"
    - name: "speckit.squad.feedback"
      file: "commands/squad.feedback.md"
      description: "Post-implementation feedback intake"
    - name: "speckit.squad.resume"
      file: "commands/squad.resume.md"
      description: "Provide answer to human escalation"
    - name: "speckit.squad.change"
      file: "commands/squad.change.md"
      description: "Handle specification change during build phase"
    - name: "speckit.squad.verify"
      file: "commands/squad.verify.md"
      description: "Run full backpropagation verification — 100% spec coverage check"
    - name: "speckit.squad.health"
      file: "commands/squad.health.md"
      description: "Periodic health check — spec-code drift, estimate drift, KB freshness"

  config:
    - name: "squad-config.yml"
      template: "config-template.yml"
      description: "Squad configuration"
      required: false

hooks:
  after_tasks:
    command: "speckit.squad.run"
    optional: true
    prompt: "Run cognitive squad analysis on generated tasks?"
    description: "Automatically analyze tasks with the cognitive squad"

tags:
  - "ai-agents"
  - "cognitive"
  - "pre-code"
  - "analysis"
