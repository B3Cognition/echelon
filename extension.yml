        color: red
    - name: "speckit.echelon.engineering-manager"
      file: "agents/build/engineering-manager.md"
      description: "ENGINEERING MANAGER — orchestrates build phase convergence toward spec coverage"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes workflow-compliance-report.md
        color: red
    - name: "speckit.echelon.integrator"
      file: "agents/build/integrator.md"
      description: "INTEGRATOR — verifies system integration after each build phase"
      behavior:
        execution: agent
        capability: balanced
        tools: write         # writes integration-report.md
        color: red
    - name: "speckit.echelon.progress-tracker"
      file: "agents/build/progress-tracker.md"
      description: "PROGRESS TRACKER — tracks effort vs estimates and warns on schedule drift"
      behavior:
        execution: agent
        capability: balanced
        tools: write         # writes progress-report.md, process-metrics.md
        color: red
    - name: "speckit.echelon.change-controller"
      file: "agents/build/change-controller.md"
      description: "CHANGE CONTROLLER — assesses blast radius of spec changes and plans propagation"
      behavior:
        execution: agent
        capability: strong
