        color: purple
    # Specialists layer
    - name: "speckit.echelon.investigator"
      file: "agents/specialists/investigator.md"
      description: "INVESTIGATOR — scientific researcher for unknowns and spike investigations"
      behavior:
        execution: agent
        capability: strong
        tools: full          # needs Bash to run experiments in worktrees
        color: cyan
    - name: "speckit.echelon.guardian"
      file: "agents/specialists/guardian.md"
      description: "GUARDIAN — security architect conducting threat models"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes threat-model.md, compliance-requirements.md, risk-acceptance-log.md
        color: cyan
    - name: "speckit.echelon.benchmark"
      file: "agents/specialists/benchmark.md"
      description: "BENCHMARK — performance engineer modeling capacity and scalability"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes performance-requirements.md, capacity-model.md
        color: cyan
    - name: "speckit.echelon.advocate"
      file: "agents/specialists/advocate.md"
      description: "ADVOCATE — accessibility specialist ensuring WCAG compliance"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes accessibility-requirements.md, user-flow.md
        color: cyan
    - name: "speckit.echelon.oracle"
      file: "agents/specialists/oracle.md"
      description: "ORACLE — domain-specific knowledge specialist"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes domain amendments to spec, plan, glossary
        color: cyan
    - name: "speckit.echelon.maverick"
      file: "agents/specialists/maverick.md"
      description: "MAVERICK — innovation consultant breaking assumptions via AutoTRIZ"
      behavior:
        execution: agent
        capability: strong
        tools: write         # writes alternatives.md, risk-opportunities.md
        color: cyan
    # Learning layer
    - name: "speckit.echelon.auditor"
      file: "agents/learning/auditor.md"
      description: "AUDITOR — calibration engineer tracking squad confidence profile"
      behavior:
        execution: agent
        capability: balanced
        tools: full          # needs Bash to run `understanding` CLI in Mode 4 post-build self-assessment
        color: yellow
    - name: "speckit.echelon.internalizer"
      file: "agents/learning/internalizer.md"
      description: "INTERNALIZER — computes 16 internalization metrics for comprehension measurement"
      behavior:
        execution: agent
        capability: balanced
        tools: write         # writes internalization-metrics.md, internalization-log.yaml
        color: yellow
    - name: "speckit.echelon.adaptive"
      file: "agents/learning/adaptive.md"
      description: "ADAPTIVE — quality trajectory analyst detecting stagnation and regression"
      behavior:
        execution: agent
        capability: balanced
        tools: write         # writes evolution-report.md, stagnation-flags.md
        color: yellow
    - name: "speckit.echelon.realist"
      file: "agents/learning/realist.md"
      description: "REALIST — connects squad artifacts to real-world data and historical outcomes"
      behavior:
        execution: agent
        capability: balanced
        tools: write         # writes reality-check.md, cost-analysis.md, benchmark-data.md
        color: yellow
    - name: "speckit.echelon.mirror"
      file: "agents/learning/mirror.md"
      description: "MIRROR — post-mortem facilitator extracting patterns from retrospectives"
      behavior:
