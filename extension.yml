schema_version: "1.0"

extension:
  id: "cognitive-squad"
  name: "Cognitive Squad"
  version: "0.6.0"
  description: "Multi-agent cognitive system: 7-layer, 42-agent architecture with adversarial critic (SAGE), kill gate (GATEKEEPER), role-separation enforcement, cross-run calibration learning with per-agent injection, full 34-metric Understanding integration, expert persona prompts, brownfield support via PROSPECTOR+GOLDDIGGER, and RADAR real-time monitoring"
  author: "Testimonial"
  repository: "https://github.com/Testimonial/cognitive-squad"
  license: "MIT"

requires:
  speckit_version: ">=0.4.2"
  tools:
    - name: "understanding"
      version: ">=3.6.0"
      required_for: "WHY2, WHY3 (spec-validation)"
      hard_stop: true
      note: "System CLI at ~/.local/bin/understanding. HARD STOP if unavailable for WHY2/WHY3 — heuristic fallback proven 15-29% overconfident (PAT-006). WHY1 (assumption-challenge) does not require it."
    - name: "spec-kit-reverse-eng"
      version: ">=1.1.0"
      required: false
      # Integration: invoked via GOLDDIGGER agent (Skill tool), not as a CLI binary.
      # PROSPECTOR discovers availability; GOLDDIGGER drives Phase 1 extraction.

provides:
  commands:
    - name: "speckit.cognitive-squad.run"
      file: "commands/cognitive-squad.run.md"
      description: "Full autonomous cognitive squad run"
    - name: "speckit.cognitive-squad.build"
      file: "commands/cognitive-squad.build.md"
      description: "Execute the building phase — implement tasks with role-based agents"
    - name: "speckit.cognitive-squad.status"
      file: "commands/cognitive-squad.status.md"
      description: "Check current squad state and progress"
    - name: "speckit.cognitive-squad.innovate"
      file: "commands/cognitive-squad.innovate.md"
      description: "Manually trigger INNOVATE specialist"
    - name: "speckit.cognitive-squad.investigate"
      file: "commands/cognitive-squad.investigate.md"
      description: "Manually trigger SCIENTIST for a specific question"
    - name: "speckit.cognitive-squad.ground"
      file: "commands/cognitive-squad.ground.md"
      description: "Manually trigger reality check on artifacts"
    - name: "speckit.cognitive-squad.feedback"
      file: "commands/cognitive-squad.feedback.md"
      description: "Post-implementation feedback intake"
    - name: "speckit.cognitive-squad.resume"
      file: "commands/cognitive-squad.resume.md"
      description: "Provide answer to human escalation"
    - name: "speckit.cognitive-squad.change"
      file: "commands/cognitive-squad.change.md"
      description: "Handle specification change during build phase"
    - name: "speckit.cognitive-squad.verify"
      file: "commands/cognitive-squad.verify.md"
      description: "Run full backpropagation verification — 100% spec coverage check"
    - name: "speckit.cognitive-squad.health"
      file: "commands/cognitive-squad.health.md"
      description: "Periodic health check — spec-code drift, estimate drift, KB freshness"

  config:
    - name: "squad-config.yml"
      template: "config-template.yml"
      description: "Squad configuration"
      required: false

hooks:
  after_tasks:
    command: "speckit.cognitive-squad.run"
    optional: true
    prompt: "Run cognitive squad analysis on generated tasks?"
    description: "Automatically analyze tasks with the cognitive squad"

tags:
  - "ai-agents"
  - "cognitive"
  - "pre-code"
  - "analysis"
