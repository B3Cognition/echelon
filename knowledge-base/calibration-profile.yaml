      affected_metrics: [structure, testability, completeness_score]
      effect: "suppression — floor ~0.57 Structure, ~0.65 Testability regardless of spec quality"
      confirmed_run: echelon-proto-cognitive-enhancement
      structure_correction: 0.20
      testability_correction: 0.12
      correction_confidence: 0.45
      recommended_action: "Exclude structure/testability from gate pass/fail for bold-ID specs; use substantive_quality_assessment instead. Switch to `- FR-ID:` bullet format to eliminate parser incompatibility."
    notes: "Second run. Spec 016. Deterministic tooling (Understanding v3.4.0) active but parser-format incompatibility confirmed: bold-ID FR format (**FR-ID**) suppresses completeness_score and Structure gate. WHY2 best overall: 0.7062 (Pass 1); forced convergence at Pass 4 (overall 0.6694). Substantive quality HIGH (35 FRs, 11 NFRs, hard_constraint_ratio=0.886, all WHY1/WHY2 high issues resolved). Score projection 66.6→77.2 confidence: 0.52 — ECC cold-start and A-009 Tier-1 reclassification are primary downside risks. Accuracy held at 0.48 (insufficient feedback data; proxy metrics only). Next update trigger: Phase 1 B3 re-benchmark."
