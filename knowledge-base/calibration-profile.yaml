    last_updated: "2026-03-17"
    notes: >
      Estimated -- no feedback data. Transport abstraction (ADR-007) and decoder registry decisions
      passed WHY and GROUND validation. JSONP constraint confirmed empirically (R-001, 0.95 confidence).
