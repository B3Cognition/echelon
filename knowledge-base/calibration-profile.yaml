  effort-estimation:
    accuracy: 0.45
    sample_size: 1
    trend: "insufficient data"
    correction_factor: 1.4
    last_updated: "2026-03-17"
    notes: >
      Estimated -- no feedback data but GROUND provides strong proxy signal. GROUND found the plan
      1.4x optimistic using reference-class forecasting (industry data: 83% of migrations exceed
      budget, average 30% cost overrun, 41% time overrun). Specific findings: 22-week wall-clock
      corrected to 30-40 weeks; T064 legacy bridge 3 days corrected to 10-15 days (3-5x underestimate);
      widget migration 25pw corrected to 38-45pw (+50-80%); team onboarding not budgeted (3 weeks missing).
      ASSESS2 revised total from 102pw to 107pw; GROUND suggests 150pw realistic.
      Correction factor 1.4x applied to all future estimates from this squad until feedback calibrates.
      Math: ASSESS said 102pw, ASSESS2 said 107pw, GROUND says 150pw. Ratio: 150/107 = 1.4x.

