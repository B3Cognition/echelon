schema_version: 1
domains:
  widget-architecture:
    accuracy: 0.80
    sample_size: 1
    trend: "insufficient data"
    correction_factor: 1.0
    last_updated: "2026-03-17"
    notes: >
      Estimated -- no feedback data. First run. Lit + Shadow DOM decision (ADR-001, ADR-005)
      passed WHY3 and was validated by GROUND against enterprise-scale production deployments
      (Adobe Spectrum, SAP UI5, Microsoft Fluent UI). Confidence was high (0.85-0.90) and
      GROUND confirmed the architecture as sound. Proxy accuracy from WHY pass rate: 5/5 architecture
      checks passed. One WARNING: Observable Plot in Shadow DOM is unverified (POC needed).
      Deduct for this unknown. No feedback yet to confirm real-world outcome.

  data-pipeline:
    accuracy: 0.75
    sample_size: 1
    trend: "insufficient data"
    correction_factor: 1.0
    last_updated: "2026-03-17"
    notes: >
      Estimated -- no feedback data. Transport abstraction (ADR-007) and decoder registry decisions
      passed WHY and GROUND validation. JSONP constraint confirmed empirically (R-001, 0.95 confidence).
      Custom transport forced by constraint (no off-the-shelf JSONP support) -- low decision risk.
      Deducted for: binary decoder porting complexity flagged as knowledge-concentrated risk;
      T018 NEEDS_CLARIFICATION (version inventory missing); dual OMO/SDAPI uncertainty (U-001 unresolved).
      GROUND confirmed custom transport is the only viable option. Proxy: WHY pass + GROUND confirmation.

  effort-estimation:
    accuracy: 0.50
    sample_size: 2
    trend: "stable (1.4x correction holds)"
    correction_factor: 1.4
    last_updated: "2026-03-17"
    notes: >
      Updated after squad-run-002 (expanded scope). The 1.4x correction factor from run-001 was
      applied to run-002 estimates and appears to hold. Run-002 raw estimate was 75.3 pw, calibrated
      to 105 pw (x1.4). GROUND pass 2 found this ~10% optimistic (should be ~112-119 pw) but within
      acceptable tolerance. The correction factor absorbs the delta.

      However, the BASE was wrong in run-001: ASSESS estimated 107 pw for 51 widgets (MVP scope),
      but the actual product scope is 202 widgets. Total effort including infrastructure: ~59 pw
      (done) + 105 pw (remaining) = ~164 pw for full parity. Original ASSESS said 107 pw for MVP
      only. If we extrapolate: 107 pw MVP / 51 widgets = 2.1 pw/widget; 202 widgets x 2.1 = 424 pw
      -- which is wildly wrong because infrastructure doesn't scale linearly with widgets.

      The run-002 estimate (164 pw total for 202 widgets = 0.81 pw/widget avg including infra) is
      more credible because it correctly separates infrastructure (fixed cost) from per-widget work
      (variable cost). Accuracy improved from 0.45 to 0.50 because the second estimate leveraged
      known infrastructure velocity. The 1.4x correction factor remains appropriate.

      Key insight: per-widget effort decreases as infrastructure matures. First 51 widgets cost
      ~59 pw infra + 48 pw widgets = 107 pw (2.1 pw/widget). Remaining 151 widgets cost ~0 pw
      infra + 105 pw widgets = 105 pw (0.7 pw/widget). This 3x efficiency gain is real and
      expected for mature infrastructure.

  requirements-engineering:
    accuracy: 0.45
    sample_size: 2
    trend: "declining"
    correction_factor: 1.2
    last_updated: "2026-03-17"
    notes: >
      Updated after squad-run-002 (expanded scope). Original accuracy was 0.60 based on WHY1 fail,
      WHY2 borderline pass, WHY3 pass-with-warnings. Now reduced to 0.45 because of PIT-006: ASSESS
      misread user intent (scoped to MVP 51 widgets instead of full parity 202 widgets). This is a
      fundamental requirements-engineering failure -- getting the scope wrong means the entire spec
      was for the wrong product. The squad had to re-run entirely. Combined with WHY1 failure, the
      requirements-engineering domain has failed significantly on 2 of 2 runs: run-001 failed on
      testability (WHY1), run-002 failed on scope (PIT-006). Correction factor 1.2x applied:
      when ASSESS produces a scope, expand it by 1.2x to account for likely under-scoping.
      Key fix: ASSESS must confirm scope with user before proceeding (see PIT-006 avoidance).
