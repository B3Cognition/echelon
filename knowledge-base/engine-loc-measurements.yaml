datahike_temporal_api:
  status: "stable"
  as_of:
    namespace: "datahike.api (via datahike.api.impl)"
    stability_marker: ":stable"
    implementation: "datahike.api.impl/as-of -> datahike.db/AsOfDB record"
  since:
    namespace: "datahike.api (via datahike.api.impl)"
    stability_marker: ":stable"
    implementation: "datahike.api.impl/since -> datahike.db/SinceDB record"
  history:
    namespace: "datahike.api (via datahike.api.impl)"
    stability_marker: ":stable"
    implementation: "datahike.api.impl/history -> datahike.db/HistoricalDB record"
  experimental_namespaces:
    - datahike.experimental.versioning: "Git-like branching — separate concern from temporal queries"
    - datahike.experimental.unstructured: "Schema inference for unstructured data — unrelated to temporal"
  evidence: >
    All three temporal functions (as-of, since, history) are defined in
    datahike.api.specification with :stability :stable. They are core API
    functions, NOT in the experimental namespace. The experimental namespace
    contains only versioning (git-like branching) and unstructured (schema
    inference) — both unrelated to temporal queries. The temporal predicates
    (as-of-pred, since-pred) are in datahike.db which is the core DB module.
    Conclusion: temporal API is fully stable, production-ready.

kb_cycle_topology:
  cycles_inherent: false
  bdi_goal_plan_tree_structure: "naturally acyclic (tree/forest)"
  reasoning: >
    In Jason's BDI architecture, goal-plan relationships form a TREE structure,
    not a graph with cycles:

    1. PLAN STRUCTURE: Each Plan has a Trigger (event pattern) and a PlanBody
       (sequence of actions/subgoals). Plans are stored in PlanLibrary indexed
       by trigger type — there are no direct plan-to-plan references.

    2. GOAL DECOMPOSITION: When a plan body contains !subgoal (achieve),
       the TransitionSystem creates a NEW Event, searches for relevant plans,
       and pushes a new IntendedMeans onto the Intention stack. This is stack-based
       execution — the call stack naturally prevents structural cycles.

    3. INTENTION STACK: Intentions are stacks of IntendedMeans. Each level
       represents one plan instance. The stack grows when subgoals are posted
       and shrinks when plans complete. A cycle would mean infinite stack growth
       (detectable, not structural).

    4. RUNTIME vs STRUCTURAL: While an agent COULD write plans where
       !goalA triggers a plan that posts !goalB which triggers a plan that posts
       !goalA (runtime cycle), this is a programming error (infinite recursion),
       not an inherent architectural property. Jason has no built-in cycle
       detection but the stack-based execution model makes cycles manifest as
       stack overflows, not deadlocks.

    5. FOR COGNITIVE ORCHESTRATION: Goal references in a well-designed agent
       should form a DAG (directed acyclic graph). The orchestrator can enforce
       this statically by checking that no goal's plan tree references an
       ancestor goal. This is a design constraint, not an engine limitation.

  implication_for_design: >
    Cyclic goal references are AVOIDABLE by design. The cognitive agent
    orchestrator should enforce a DAG constraint on goal-plan relationships
    at configuration time. Jason's architecture naturally supports this
    since plans are indexed by trigger patterns, and the intention stack
    provides natural recursion depth limits.
