    run_id: squad-1774681342
    created_at: 2026-03-28T00:00:00Z
    last_updated: 2026-03-28
    validated_by_feedback: false
    confidence: 0.78
    description: Using only overall score for convergence delta allows false convergence when individual categories oscillate (e.g., structure improves +0.05 while semantic drops -0.04, overall unchanged). Checking MAX(abs(delta)) across all 7 categories catches this. Requires state.json to store all 7 scores (not 3).
