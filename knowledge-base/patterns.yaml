schema_version: 1
entries:
  - id: PAT-001
    name: "SCIENTIST resolves empirically testable assumptions before spec"
    domain: "requirements-engineering"
    evidence_grade: "C"
    source: "squad-run-001, reasoning-journal entries RJ-014, RJ-004"
    validated_by_feedback: false
    confidence: 0.85
    description: "When DISCOVER identifies assumptions that are empirically testable (e.g., CORS headers, API responses), SCIENTIST should test them immediately rather than deferring to stakeholder questions. WHY caught A-006 (JSONP required) as testable with a single HTTP request. Empirical resolution is faster and higher-confidence than asking teams."
    tags: ["assumptions", "empirical-testing", "scientist"]
    status: active

  - id: PAT-002
    name: "MVP scoped as pattern-proving increment, not feature-complete"
    domain: "requirements-engineering"
    evidence_grade: "C"
    source: "squad-run-001, reasoning-journal entry RJ-017"
    validated_by_feedback: false
    confidence: 0.85
    description: "For large migration projects, defining MVP as 'core infrastructure + one complete vertical (sport/domain)' rather than 'all features' prevents unshippable scope. The V5 spec defined MVP as infrastructure + one sport, proving the pattern end-to-end. Remaining verticals are post-MVP incremental work."
    tags: ["mvp-scoping", "migration", "incremental-delivery"]
    status: active

  - id: PAT-003
    name: "Architecture decisions driven by embedding constraint"
    domain: "widget-architecture"
    evidence_grade: "B"
    source: "squad-run-001, reasoning-journal entries RJ-027, RJ-028"
    validated_by_feedback: false
    confidence: 0.90
    description: "For embeddable third-party widgets, the embedding constraint (widgets on customer pages) should be the primary architecture driver. Shadow DOM for style isolation, custom elements for API surface, and CSS custom properties for theming all follow directly from 'we do not own the host page.' This constraint eliminated React (assumes page ownership) in favor of Lit/Web Components."
    tags: ["web-components", "shadow-dom", "architecture-drivers", "lit"]
    status: active

  - id: PAT-004
    name: "GROUND reality-check catches optimism bias in first estimates"
    domain: "effort-estimation"
    evidence_grade: "C"
    source: "squad-run-001, reasoning-journal entry RJ-024, reality-check.md"
    validated_by_feedback: false
    confidence: 0.80
    description: "First-run estimates without calibration data are consistently optimistic. GROUND applied reference-class forecasting (industry migration overrun data: 83% exceed budget) and identified the plan was 1.4x optimistic. The 22-week timeline was corrected to 30-40 weeks. Always apply reference-class adjustment to uncalibrated first estimates."
    tags: ["estimation", "reference-class", "optimism-bias", "ground"]
    status: active

  - id: PAT-005
    name: "Feed pipeline as highest-priority architectural decision"
    domain: "data-pipeline"
    evidence_grade: "B"
    source: "squad-run-001, reasoning-journal entries RJ-002, RJ-010, RJ-018"
    validated_by_feedback: false
    confidence: 0.85
    description: "In data-heavy widget systems, the feed/data pipeline is the most volatile and maintenance-intensive subsystem (confirmed by git hotspot analysis). Architecture decisions about transport abstraction and decoder registries should be prioritized over rendering decisions because the data layer drives most ongoing maintenance work."
    tags: ["data-pipeline", "architecture-priority", "hotspot-analysis"]
    status: active

  - id: PAT-006
    name: "Scope expansion is volume, not complexity, when infrastructure is proven"
    domain: "effort-estimation"
    evidence_grade: "B"
    source: "squad-run-002, expanded-scope re-evaluation"
    validated_by_feedback: false
    confidence: 0.80
    description: "When a migration project's infrastructure is already built and tested (710 tests, 143 files), expanding scope from 51 to 202 widgets does NOT multiply effort proportionally. Infrastructure was the dominant cost driver (~59 pw of ~107 pw total). The remaining widget work scaled sub-linearly because established patterns (feed pipeline, mappers, translators, sport registry) are reusable. 4x widgets added ~2x remaining effort, not 4x."
    tags: ["estimation", "scope-expansion", "infrastructure-leverage", "migration"]
    status: active

  - id: PAT-007
    name: "WHY challenge catches scope-level CRITICALs that ASSESS misses"
    domain: "requirements-engineering"
    evidence_grade: "B"
    source: "squad-run-002, WHY pass on expanded scope"
    validated_by_feedback: false
    confidence: 0.85
    description: "When ASSESS incorrectly scopes to MVP instead of full parity, the WHY agent catches CRITICAL gaps that would make the product incomplete. In the V5 run, WHY caught 3 CRITICALs: video widget support (DAZN SDK), testing infrastructure for 4x scope, and SVG visualization pipeline. These were not complexity issues but completeness issues that ASSESS missed by narrowing scope prematurely."
    tags: ["why-challenge", "scope-validation", "completeness", "critical-gaps"]
    status: active

  - id: PAT-008
    name: "Re-run squad on expanded scope requires new ADRs, not just bigger estimates"
    domain: "widget-architecture"
    evidence_grade: "B"
    source: "squad-run-002, ADR-013 through ADR-016"
    validated_by_feedback: false
    confidence: 0.80
    description: "Expanding scope from MVP to full parity required 4 new Architecture Decision Records (video embedding, WebSocket transport, SVG field renderers, content widget pattern) because the expanded scope introduced qualitatively different widget types. Simply scaling up estimates would have missed that video widgets need light DOM, motorsport needs WebSocket, and content widgets bypass the feed pipeline entirely."
    tags: ["architecture", "scope-expansion", "adr", "qualitative-differences"]
    status: active
