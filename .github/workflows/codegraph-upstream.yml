name: CodeGraph Upstream Compatibility

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  latest-codegraph-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Smoke test against upstream CodeGraph latest
        run: bash scripts/test-codegraph-latest.sh
