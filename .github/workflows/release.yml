name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REQUIRED_CHECKS: "Shell tests (unit + integration + e2e + validation),Python unit tests"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release tag and metadata
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.0; got '$tag'."
            exit 1
          fi

          version="${tag#v}"
          previous_pyproject="$(mktemp)"
          if ! git show "${GITHUB_SHA}^:pyproject.toml" > "$previous_pyproject"; then
            echo "::error::Could not read pyproject.toml from the tagged commit's parent."
            exit 1
          fi

          python - "$version" "$previous_pyproject" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          import tomllib

          expected = sys.argv[1]
          previous_pyproject = Path(sys.argv[2])
          root = Path.cwd()
          pyproject = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          if package_version != expected:
              raise SystemExit(
                  f"tag version {expected} does not match pyproject version {package_version}"
              )
          previous_version = tomllib.loads(
              previous_pyproject.read_text(encoding="utf-8")
          )["project"]["version"]

          spec = importlib.util.spec_from_file_location(
              "prepare_release", root / "scripts" / "prepare-release.py"
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.require_next_minor_release(previous_version, expected)
          module.validate_release_metadata(root, expected)
          PY

      - name: Require green CI for tagged commit
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            -f per_page=100 \
            > "$tmp"

          python - "$tmp" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          required = [name.strip() for name in os.environ["REQUIRED_CHECKS"].split(",")]
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          runs = payload.get("check_runs", [])
          by_name = {}
          for run in runs:
              name = run.get("name")
              if not name:
                  continue
              previous = by_name.get(name)
              if previous is None or (run.get("started_at") or "") > (previous.get("started_at") or ""):
                  by_name[name] = run

          failures = []
          for name in required:
              run = by_name.get(name)
              if run is None:
                  failures.append(f"{name}: missing")
                  continue
              status = run.get("status")
              conclusion = run.get("conclusion")
              if status != "completed" or conclusion != "success":
                  failures.append(f"{name}: status={status} conclusion={conclusion}")

          if failures:
              print(
                  "Required CI checks are not green for this exact commit. "
                  "Wait for CI on main to pass, then re-run this release workflow."
              )
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(1)

          print("Required CI checks are green for this tagged commit:")
          for name in required:
              print(f" - {name}")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package artifacts
        run: python -m build

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
