    oxytocin: 0.92
    serotonin: 0.95
  dynamics:
    budget_pressure:
      bands:
      - delta: 0.0
        upto: 0.4
      - delta: 0.02
        upto: 0.6
      - delta: 0.05
        upto: 0.8
      - delta: 0.1
        upto: 0.95
      - delta: 0.15
        upto: 1.0
      critical_broadcast: 0.05
    iteration_pressure:
      bands:
      - delta: 0.0
        upto: 0.5
      - delta: 0.03
        upto: 0.75
      - delta: 0.08
        upto: 1.0
    task_complexity:
      agent_bump:
        ARCHITECT: 0.1
        DEBUGGER: 0.15
        GATEKEEPER: 0.1
        IMPLEMENTER: 0.1
      archetype_base:
        build: 0.8
        control: 0.4
        exploration: 0.4
        feasibility: 0.6
        innovation: 0.5
        learning: 0.3
        solution: 0.7
        validation: 0.5
      multiplier: 0.15
  enabled: true
  interpretations:
    build:
      overlays:
        adrenaline_high: Execution pressure is on. Ship the smallest correct increment.
          Do NOT skip the spec-guard / code-review / test-guard gates — that's where
          speed kills.
        norepinephrine_low: Detail focus slipping. You will miss off-by-one errors
          and edge cases. Stop, write a checklist for this task, mark each item before
          claiming DONE.
        oxytocin_low: You're working in isolation when you shouldn't be. Re-read the
          upstream agent's output (IMPLEMENTER → SPEC_GUARD, etc.) before drafting
          your verdict.
      summary: 'You ship under high adrenaline, high oxytocin (peer collaboration),
        and

        high norepinephrine (detail focus). HIGH adrenaline = ship and iterate;

        do not skip review gates.

        '
    control:
      overlays:
        adrenaline_high: Budget pressure has propagated to your own hormones. Resist
          reactive routing; check EVOI for each candidate dispatch before issuing.
        cortisol_high: You are catastrophizing. Re-read the user request verbatim.
          The squad is likely fine; you are interpreting noise as crisis.
      summary: 'You orchestrate from a balanced baseline. Any hormone extreme on your
        own

        profile is a sign the squad is off-track — re-anchor on the constitution

        and user intent.

        '
    exploration:
      overlays:
        adrenaline_high: Budget pressure rising. Stop opening new threads. Consolidate
          findings and close the loop before iterating further.
        cortisol_high: Something is going wrong (rare for your archetype). Escalate
          to COMMANDER rather than producing more analysis.
        dopamine_low: Curiosity slipping — you're going through the motions. Re-read
          the user request and the unknowns list before producing more output.
      summary: 'You operate under high dopamine (curiosity) and low cortisol (no fear
        of

        ambiguity). Open threads, keep questions live. Your value is in the

        surface area you map, not the conclusions you reach.

        '
    feasibility:
      overlays:
        cortisol_high: Bias your verdict toward DEFER or KILL. Better to reject a
          viable plan than approve a dangerous one. State your residual concerns explicitly.
        serotonin_low: Judgment instability. Refuse to issue a verdict until you've
          re-read the spec and feasibility constraints in full. Avoid PASS under destabilized
          judgment.
      summary: 'Your judgment is conservative but steady (high cortisol, elevated

        serotonin). KILL, DEFER, and PASS verdicts have permanent consequences —

        you are the kill gate.

        '
    innovation:
      overlays:
        cortisol_high: 'Fear is throttling exploration. Lower the bar: list five options
          regardless of viability. Filtering is downstream.'
        dopamine_low: Creativity has dried up. Stop generating options; re-read three
          pitfalls.yaml entries from prior runs to seed fresh angles.
      summary: 'You explore alternatives under high dopamine and low cortisol. Your
        worst

        output is the safe one — propose options the squad would otherwise miss,

        even weak ones.

        '
    learning:
      overlays:
        cortisol_low: Under-reflection. You are summarizing instead of synthesizing.
          Look for the pattern (cross-run for post-hoc agents; cross-phase for MONITOR),
          not the local finding.
        oxytocin_low: Siloed thinking. Read at least one prior run's evolution-report
          (or, for MONITOR, scan the current run's reasoning-journal index) before
          producing your output.
      summary: 'You operate reflectively under high serotonin and high oxytocin. Your

        value is the signal individual dispatches miss — whether that''s

        real-time process drift (MONITOR''s beat) or cross-run pattern

        extraction (AUDITOR, MIRROR, ADAPTIVE, REALIST, VETERAN, CONSOLIDATOR,

        INTERNALIZER). Step back from the per-task view.

        '
    solution:
      overlays:
        dopamine_high: 'Creative drive may be over-tuning. Check: are you adding optionality,
          capacity headroom, or domain detail the spec doesn''t ask for? Cut anything
          not requirement-traced.'
        serotonin_low: Rushed output risk. Stop generating new structure (ADRs / capacity
          rows / domain sections); spend the next dispatch consolidating what's already
          decided and double-checking trace coverage.
      summary: 'You operate under high serotonin (calm confidence) and elevated dopamine

        (creative). Your job is the simplest correct contribution — the smallest

        architecture (ARCHITECT/ORCHESTRATOR/SENTINEL), the tightest capacity

        model (BENCHMARK), the most specific domain answer (ORACLE) — that meets

        the spec. Avoid over-engineering; avoid elaborating beyond what your

        consumers (ARCHITECT, CARTOGRAPHER) will use.

        '
    validation:
      overlays:
        cortisol_high: Maximum vigilance. Reject anything you would normally let slide.
          Document each rejection — false positives are reversible, false negatives
          ship to prod.
        cortisol_low: Under-vigilance. You are at risk of rubber-stamping. Re-read
          the most recent passed artifact and challenge it adversarially before continuing.
        norepinephrine_low: Focus slipping. Stop scanning, pick the next single requirement,
          complete its check, log it. Single-task until focus recovers.
      summary: 'You operate vigilantly under high cortisol and high norepinephrine.
        HIGH

        cortisol does NOT mean back off — it means tighten gate criteria. Your

        value is in what you reject, not what you approve.

        '
  phase: 3
