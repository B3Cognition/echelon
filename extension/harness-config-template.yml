# Echelon Harness — Configuration Template
#
# After installing the extension, spec-kit copies this file to:
#   .specify/extensions/harness/harness-config.yml
#
# That file is committed to your harness repository.
# Machine-specific overrides (credentials, local paths) go in:
#   .specify/extensions/harness/local-config.yml  (gitignored)
#
# Environment variables override all files:
#   SPECKIT_HARNESS_<SECTION>_<KEY>=value
#   e.g. SPECKIT_HARNESS_RESOURCE_LIMITS_MEMORY=8g
#
# Config is merged in order (lowest → highest precedence):
#   extension defaults → harness-config.yml → local-config.yml → env vars
#
# Only override what you need — all values below are defaults.

# --- Required ---

# URL or path of the target repository to build/test/verify inside the sandbox.
# Use "." to target the current repo (single-repo model — harness installed in the target itself).
# Use a remote URL for the two-repo model (separate harness control-plane repo).
target_repo: "https://github.com/your-org/your-repo"

# Default branch of the target repository
target_default_branch: "main"

# Sandbox provider to use
# Phase 1: "docker" (production-ready)
# Phase 3 (planned): "e2b", "modal", "daytona"
provider: "docker"

# --- Docker Image ---

# Base image for the sandbox container
# If unset, harness will attempt to auto-resolve from the target repo's devcontainer.json
# base_image: "ubuntu:22.04"

# Pin the image to a specific digest for reproducibility
# image_digest_pin: "sha256:abc123..."

# --- Resource Limits ---

resource_limits:
  # Max memory for the sandbox container
  memory: "4g"

  # Max CPU cores (fractional allowed)
  cpu: 2.0

  # Max number of processes inside the sandbox
  pids: 256

  # Max writable storage for the sandbox filesystem
  storage: "10g"

# --- Network Policy (Squid proxy) ---

network:
  # Allowlist of hostnames the sandbox can reach
  # All other outbound traffic is blocked
  allowlist:
    - "registry.npmjs.org"
    - "pypi.org"
    - "files.pythonhosted.org"
    - "proxy.golang.org"
    - "crates.io"
    - "static.crates.io"
    - "repo1.maven.org"
    - "playwright.azureedge.net"
    - "cdn.playwright.dev"

  # Docker image for the Squid proxy sidecar
  proxy_image: "ubuntu/squid:latest"

# --- Output Buffering ---

# Maximum bytes captured from sandbox stdout/stderr per command
# Truncation is applied symmetrically (head + tail) beyond this limit
buffer_limit_bytes: 10485760  # 10MB

# --- GitOps ---

# Tag injected into sandbox commit messages to suppress CI pipelines
ci_skip_tag: "[skip ci]"

# Whether to inject ci_skip_tag into sandbox commits
# Disable only if your CI correctly ignores harness branches
ci_skip_enabled: true

# --- Garbage Collection ---

gc:
  # Abandon worktrees older than this many hours
  worktree_max_age_hours: 24

  # Stop and remove sandbox containers older than this many hours
  container_max_age_hours: 1

  # Delete harness state backups older than this many days
  backup_max_age_days: 7

# --- Echelon Integration ---

# Semver range constraint for the echelon extension version
# Harness validates this at init time and warns if out of range
# echelon_version_range: ">=0.9.1"

# --- Visual Tests (Phase 2) ---

# Phase 2 visual loop: runs Playwright headless tests in the Docker sandbox after
# Phase 1 (unit/logic loop) converges. Requires @playwright/test in package.json
# and a playwright.config.ts with webServer configured.
#
# Auto-detected: harness init sets enabled: true when @playwright/test is found.

visual_tests:
  # Set to true to enable Phase 2 visual verification.
  # The visual loop runs AFTER Phase 1 (unit tests) converges.
  enabled: false

  # Playwright test command. Must use --reporter=json so the harness can parse failures.
  # The playwright.config.ts webServer option should start the dev server automatically.
  test_command: "npx playwright test --reporter=json"

  # Fallback serve command when playwright.config.ts has no webServer.
  serve_command: "npm run preview"

  # Timeout in milliseconds for a single visual verify pass (server startup + test run).
  timeout_ms: 300000  # 5 minutes

  # Directory inside the container where Playwright writes screenshots.
  # Relative to /workspace (container's worktree mount point).
  screenshot_dir: "playwright-report"

  # Maximum visual loop iterations before declaring visual_failed.
  max_iterations: 3
