schema_version: "1.0"

extension:
  id: "echelon"
  name: "Echelon"
  version: "3.3.2"
  description: "Multi-agent cognitive system with adversarial critic, kill gate, role-separation enforcement, cross-run calibration learning per-agent injection, SOAR-powered build pipeline (codegen), full 34-metric requirements quality analysis, expert persona prompts, and native brownfield extraction (re-* commands). Designed for high-stakes, complex projects where quality, alignment, and risk management are paramount."
  author: "B3Cognition"
  repository: "https://github.com/B3Cognition/echelon"
  license: "MIT"
  homepage: "https://github.com/B3Cognition/echelon"

requires:
  speckit_version: ">=0.4.2"
  skills:
    # Core spec-kit skills — validated at install time via `specify extension add echelon`
    - name: "speckit.specify"
      required: true
      required_for: "CARTOGRAPHER — spec creation and branch setup"
      hard_stop: true
    - name: "speckit.constitution"
      required: true
      required_for: "constitution creation and amendment (ARCHITECT, COMMANDER)"
    - name: "speckit.plan"
      required: true
      required_for: "ARCHITECT — technical plan generation"
    - name: "speckit.tasks"
      required: true
      required_for: "ORCHESTRATOR — task decomposition"
    - name: "speckit.clarify"
      required: false
      required_for: "CARTOGRAPHER — optional spec Q&A"
    - name: "speckit.analyze"
      required: false
      required_for: "ORCHESTRATOR — cross-artifact consistency check"
  tools:
    - name: "soar"
      version: ">=9.6.4"
      required_for: "echelon.codegen — SOAR-powered build pipeline"
      hard_stop: true
      note: "Install via: bash scripts/install.sh — downloads SoarSuite and places binary at ~/.echelon/soar/bin/soar"
    - name: "understanding"
      version: ">=3.7.0"
      required_for: "WHY2, WHY3 (spec-validation), understanding.scan/validate/energy/diagram/batch"
      hard_stop: true
      note: "Bundled — installed via scripts/install.sh into ~/.echelon/venv/. HARD STOP if unavailable for WHY2/WHY3 — heuristic fallback proven 15-29% overconfident (PAT-006)."
    - name: "codegen"
      version: ">=1.5.0"
      required_for: "echelon.codegen — SOAR build pipeline"
      hard_stop: true
      note: "Bundled — installed via scripts/install.sh into ~/.echelon/venv/."
    - name: "docker"
      required: true
      required_for: "speckit.echelon.harness-run — DockerWorktreeProvider sandbox isolation for build/test/verify"
      hard_stop: true
      note: "Docker daemon must be running. Required only when using harness commands."
    - name: "git"
      required: true
      required_for: "speckit.echelon.harness-run — GitOpsManager two-repo gitops and worktree creation"
      hard_stop: true

provides:
  # Name convention: entries use dot-notation (speckit.echelon.scout).
  # spec-kit transforms this to dash-notation for deployed filenames and
  # injected frontmatter: speckit.echelon.scout → speckit-echelon-scout.
  # That dash-notation name is the canonical dispatch identifier used in
  # Agent tool calls (subagent_type) and in workflow/definition.yaml agent: fields.
  commands:
    - name: "speckit.echelon.codegenlight"
      file: "commands/echelon.codegenlight.md"
      description: "Standalone SOAR-powered build pipeline — RE → DECOMPOSE → IMPLEMENT → GATE → TEST → DELIVER"
      behavior:
        execution: isolated
        invocation: automatic
        capability: strong
        effort: high
        tools: full

    - name: "speckit.echelon.init"
      file: "commands/echelon.init.md"
      description: "One-time project initialization — bootstrap echelon-config.yml, validate deploy config, install Traefik. Run once per project before speckit.echelon.run."
      behavior:
        execution: isolated
        invocation: explicit
        capability: balanced
        tools: write

    - name: "speckit.echelon.run"
      file: "commands/echelon.run.md"
      description: "Full autonomous cognitive squad run — requires speckit.echelon.init first"
    - name: "speckit.echelon.build"
      file: "commands/echelon.build.md"
      description: "Execute the building phase — implement tasks with role-based agents"
    - name: "speckit.echelon.status"
      file: "commands/echelon.status.md"
      description: "Check current squad state and progress"
    - name: "speckit.echelon.innovate"
      file: "commands/echelon.innovate.md"
      description: "Manually trigger INNOVATE specialist"
    - name: "speckit.echelon.investigate"
      file: "commands/echelon.investigate.md"
      description: "Manually trigger SCIENTIST for a specific question"
    - name: "speckit.echelon.ground"
      file: "commands/echelon.ground.md"
      description: "Manually trigger reality check on artifacts"
    - name: "speckit.echelon.feedback"
      file: "commands/echelon.feedback.md"
      description: "Post-implementation feedback intake"
    - name: "speckit.echelon.resume"
      file: "commands/echelon.resume.md"
      description: "Provide answer to human escalation"
    - name: "speckit.echelon.bugfix"
      file: "commands/echelon.bugfix.md"
      description: "Diagnostic squad for a bug or enhancement — DEBUGGER + SENTINEL + SPEC GUARD → bugfix plan + tasks → hand off to harness.run"
    - name: "speckit.echelon.review"
      file: "commands/echelon.review.md"
      description: "Automated PR review triage — fetches blocking comments from GitHub/GitLab, groups by proximity + reviewer, DEBUGGER + SENTINEL + SPEC GUARD per group → review-fix plan + tasks. Machine-invoked by ReviewLoopController."
      behavior:
        invocation: automatic
    - name: "speckit.echelon.change"
      file: "commands/echelon.change.md"
      description: "Handle specification change during build phase"
    - name: "speckit.echelon.verify"
      file: "commands/echelon.verify.md"
      description: "Run full backpropagation verification — 100% spec coverage check"
    - name: "speckit.echelon.verify-spec"
      file: "commands/echelon.verify-spec.md"
      description: "Read-only fulfillment audit for an existing spec against the current implementation"
    - name: "speckit.echelon.reopen"
      file: "commands/echelon.reopen.md"
      description: "Reopen a spec from fulfillment gaps and append harness-ready tasks"
    - name: "speckit.echelon.health"
      file: "commands/echelon.health.md"
      description: "Periodic health check — spec-code drift, estimate drift, KB freshness"
    - name: "speckit.echelon.codegen"
      file: "commands/echelon.codegen.md"
      description: "Execute building phase via SOAR-powered codegen pipeline — alternative to echelon.build"
      behavior:
        execution: isolated
        invocation: automatic
        capability: strong
        effort: high
        tools: full
        color: red
    - name: "speckit.echelon.deploy"
      file: "commands/echelon.deploy.md"
      description: "Manual deploy trigger, status, and rollback for blue/green local CD"
      behavior:
        execution: skill
        capability: balanced
        tools: write
        color: red
    - name: "speckit.echelon.cicd"
      file: "commands/echelon.cicd.md"
      description: "Design and implement CI/CD for this project — Dockerfile, echelon-config.yml deploy block, GitHub Actions CI, and database services if detected. Re-runnable."
      behavior:
        execution: skill
        invocation: automatic
        capability: balanced
