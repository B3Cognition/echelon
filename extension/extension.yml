  config:
    - name: "echelon-config.yml"
      template: "config-template.yml"
      description: "Echelon configuration (includes harness: section for sandbox settings)"
      required: false

hooks:
  before_plan:
    command: "speckit.echelon.understanding-scan"
    optional: true
    prompt: "Run requirements quality scan on the spec before planning?"
    description: "Scan spec quality before creating the plan"
  after_tasks:
    command: "speckit.echelon.run"
    optional: true
    prompt: "Run echelon analysis on generated tasks?"
    description: "Automatically analyze tasks with the echelon cognitive system for insights and improvements"

tags:
  - "ai-agents"
  - "cognitive"
  - "pre-code"
  - "analysis"
  - "quality"
  - "metrics"
  - "requirements"
  - "sandbox"
  - "docker"
  - "gitops"
  - "ci"
  - "isolation"

config:
  defaults:
    understanding:
      threshold: 0.70
      format: "text"
      energy: false
      basic: false
      per_req: false
      diagram: false
    harness:
      container_cli: "docker"
      resource_limits:
        memory: "4g"
        cpu: 2.0
        pids: 256
        storage: "10g"
      network:
        allowlist:
          - "registry.npmjs.org"
          - "pypi.org"
          - "files.pythonhosted.org"
          - "proxy.golang.org"
          - "crates.io"
          - "static.crates.io"
          - "repo1.maven.org"
          - "playwright.azureedge.net"
          - "cdn.playwright.dev"
        proxy_image: "ubuntu/squid:latest"
      buffer_limit_bytes: 10485760
      ci_skip_tag: "[skip ci]"
      ci_skip_enabled: true
      secrets_env_file: "secrets.env"
      bind_mount_ack: false
      pr_host: "none"
      fulfillment:
        refresh_policy: "milestone"
      gc:
        worktree_max_age_hours: 24
        container_max_age_hours: 1
        backup_max_age_days: 7
      visual_tests:
        enabled: false
        serve_command: "npm run preview"
        test_command: "npx playwright test --reporter=json"
        timeout_ms: 300000
        screenshot_dir: "playwright-report"
        max_iterations: 3
    re:
      profile: full
      analysis:
        include_patterns: [ "**/*" ]
        exclude_patterns:
          - "node_modules/**"
          - "dist/**"
          - ".git/**"
          - "vendor/**"
          - "__pycache__/**"
          - "*.pyc"
        max_file_size_kb: 500
      sources:
        code: true
        tests: true
        docs: true
        git_history: true
        git_history_limit: 2500
        ci_cd: true
        deployment: true
        integrations: true
      depth:
        level: full
        max_lines_per_file: 5000
        context_management: progressive
        priority_patterns:
          - "**/main.*"
          - "**/index.*"
          - "**/app.*"
          - "**/*Service.*"
          - "**/*Controller.*"
          - "**/*Handler.*"
      output:
        directory: ".specify/echelon/re"
        generate_spec: true
        generate_plan: true
        generate_tasks: true
        keep_analysis_artifacts: true
      workflow:
        pause_between_phases: false
        require_confirmation: false
        coverage_threshold: 99
        resolution_threshold: 99
        max_validate_iterations: 5
      polyrepo:
        enabled: auto
        discovery: flat
        exclude: []
        include: []
        repos: {}
