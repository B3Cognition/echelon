schema_version: "1.0"

preset:
  id: "echelon-brownfield-compliance"
  name: "Compliance-Focused Migration"
  version: "1.0.0"
  description: "Templates for migrations in regulated industries with audit trails, data protection, and compliance checklists"
  author: "Michal Bachorik"
  repository: "https://github.com/B3Cognition/echelon"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"
  extensions:
    - id: "echelon"
      version: ">=2.1.0"

provides:
  templates:
    # Strategic artifact templates
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Constitution with compliance principles and data protection requirements"
      replaces: "constitution-template"

    - type: "template"
      name: "domain-spec-template"
      file: "templates/domain-spec-template.md"
      description: "Domain spec with data classification and compliance mapping"
      replaces: "domain-spec-template"

    - type: "template"
      name: "risk-matrix-template"
      file: "templates/risk-matrix-template.md"
      description: "Risk matrix with compliance-specific risk categories"
      replaces: "risk-matrix-template"

    - type: "template"
      name: "gap-analysis-template"
      file: "templates/gap-analysis-template.md"
      description: "Gap analysis with compliance control mapping"
      replaces: "gap-analysis-template"

    # Compliance checklists
    - type: "template"
      name: "checklist-gdpr"
      file: "checklists/gdpr-checklist.md"
      description: "GDPR compliance checklist"

    - type: "template"
      name: "checklist-hipaa"
      file: "checklists/hipaa-checklist.md"
      description: "HIPAA compliance checklist"

    - type: "template"
      name: "checklist-soc2"
      file: "checklists/soc2-checklist.md"
      description: "SOC 2 compliance checklist"

tags:
  - "compliance"
  - "gdpr"
  - "hipaa"
  - "soc2"
  - "pci-dss"
  - "audit"
  - "data-protection"
  - "security"
