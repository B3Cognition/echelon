          condition: always

    - id: re-retarget-1-input
      label: "Human Decision Input"
      spec_file: workflow/phases/re-retarget-1-input.md
      type: commander_internal    # interactive — COMMANDER prompts user directly, no agent dispatch
      transitions:
        - to: DONE
          condition: always

