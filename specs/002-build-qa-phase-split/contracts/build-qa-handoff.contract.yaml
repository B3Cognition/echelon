contract_id: build-qa-handoff
version: "0.4.0"
description: >
  Contract governing the handoff gate from BUILD phase to QA phase.
  All required tasks must be build-complete with zero blocked required tasks
  before QA can begin.

preconditions:
  all_required_tasks_build_complete: true
  required_task_status: BUILD_COMPLETE
  required_blocked_task_count: 0
  rules:
    - required_tasks_must_be_complete
    - required_blocked_forbidden
  gate_checks:
    - build_valid
    - tests_passed
    - lint_clean
    - required_outputs_present

on_violation:
  failure_action: reject_handoff
  notify: COMMANDER
  log_entry: true
