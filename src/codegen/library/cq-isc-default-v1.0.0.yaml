    psi_contribution_weight: 2.0
    soar_predicate: "(code-violation <v> ^type |debug-print-in-production| ^count > 0)"
    wme_source: "eslint,ruff,golangci-lint,checkstyle"
    test_proxy_observable: true
    severity: medium
    description: >
      Unstructured debug output pollutes log aggregation, leaks internal state,
      and degrades observability. Production code must use structured logging.
      Detection: eslint (no-console), ruff (T201/T202), golangci-lint (forbidigo), checkstyle (RegexpSingleline).
    law_ref: "reference-constitution-50rules.md#QUAL-001,QUAL-002"
    executor_validated: true
    nl2gensym_generated: false

