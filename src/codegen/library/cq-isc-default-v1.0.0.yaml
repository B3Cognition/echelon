    wme_source: "eslint,ruff,semgrep"
    test_proxy_observable: true
    severity: critical
    description: >
      Hardcoded secrets are permanently visible in version control history.
      Covers: passwords, API keys, private keys, tokens, database credentials.
      Detection: eslint (detect-secrets plugin), ruff (S105/S106/S107), semgrep (secrets ruleset).
    law_ref: "reference-constitution-50rules.md#SEC-001,SEC-002"
    executor_validated: true
    nl2gensym_generated: false

  - cq_isc_id: CQ-ISC-SEC-002
