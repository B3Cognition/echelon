      (McCabe 1976; NIST SP 500-235 — Grade B evidence).
      Detection: ruff (C901), eslint (complexity rule), golangci-lint (gocyclo), checkstyle (CyclomaticComplexity).
    law_ref: "reference-constitution-50rules.md#STRUCT-003,STRUCT-004"
    executor_validated: true
    nl2gensym_generated: false

