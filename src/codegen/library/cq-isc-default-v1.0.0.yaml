    wme_source: "ruff,eslint,golangci-lint,checkstyle"
    test_proxy_observable: true
    severity: medium
    description: >
      Functions over 30 lines are statistically correlated with higher defect rates
      and lower testability (McCabe 1976, empirical evidence Grade B).
      Detection: ruff (C901 length check), eslint (max-lines-per-function), checkstyle (MethodLength).
    law_ref: "reference-constitution-50rules.md#STRUCT-001,STRUCT-002"
    executor_validated: true
    nl2gensym_generated: false

