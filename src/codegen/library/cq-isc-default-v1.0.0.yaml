    wme_source: "pytest,vitest,junit"
    test_proxy_observable: false
    severity: high
    description: >
      One-to-one source-to-test pairing is the minimum test coverage invariant.
      The WME is generated by the IMPLEMENTER's post-task verification step,
      not by a static analysis tool.
    law_ref: "reference-constitution-50rules.md#TEST-001,TEST-002"
    executor_validated: true
    nl2gensym_generated: false

