    source_authority: DEFAULT_LIBRARY
    policy_drift_status: current
    psi_contribution_weight: 1.5
    soar_predicate: "(code-violation <v> ^type |unlinked-todo-in-production| ^count > 0)"
    wme_source: "ruff,eslint,semgrep"
    test_proxy_observable: true
    severity: low
    description: >
      Unlinked TODOs in delivered code become permanently invisible technical debt.
      A TODO with a linked issue (e.g., # TODO(GH-42): handle edge case) is permissible.
      Detection: ruff (FIX001/FIX002/FIX003/FIX004), eslint (no-warning-comments with pattern).
    law_ref: "reference-constitution-50rules.md#QUAL-003"
    executor_validated: true
    nl2gensym_generated: false

