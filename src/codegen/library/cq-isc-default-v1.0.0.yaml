  # ================================================================

  - cq_isc_id: CQ-ISC-QUAL-001
    rule_text: >
      No console.log, print(), fmt.Println, System.out.println, or equivalent
      debug output statements in production code paths. Structured logging
      (structlog, winston, zap, logback) must be used instead.
    rule_content_hash: "1dbe8dc1ad09ebc8f03a35d20fb0d0e5cc6cbde4c4b637048175bab79912c94e"
    constraint_class: QUALITY
    phase_scope: VERIFY
    language_scope: all
    source_authority: DEFAULT_LIBRARY
