    wme_source: "ruff,semgrep,golangci-lint"
    test_proxy_observable: true
    severity: high
    description: >
      HTTP requests without timeout can cause resource exhaustion and Slowloris-class DoS.
      Covers: requests.get() without timeout, fetch() without AbortController, http.Do() without deadline.
      Detection: ruff (S113), semgrep (python.requests.no-timeout).
    law_ref: "reference-constitution-50rules.md#SEC-007"
    executor_validated: true
    nl2gensym_generated: false

