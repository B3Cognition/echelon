# Cognitive Squad Configuration
# Copy to squad-config.yml and customize
#
# GUIDANCE NOTATION:
#   [range: X-Y]     = sensible values, beyond this is likely wasteful or broken
#   [default: X]     = recommended starting point
#   [disable: X]     = set to this value to effectively disable the check
#
# =============================================================================
# EXECUTION — How agents run
# =============================================================================

execution:
  # Maximum concurrent subagents (Claude Code Agent tool calls in one message)
  # [range: 1-5] Higher = faster but more tokens. Lower = sequential but cheaper.
  max_parallel_agents: 3

  # Per-agent timeout (seconds). Agent is killed and retried once if exceeded.
  # [range: 60-600] Most agents complete in 60-180s. 600s = edge cases.
  agent_timeout_seconds: 300

  # Max retries per agent before skipping with warning
  # [range: 0-3] Higher = more resilient, but may waste tokens on stuck agents.
  max_retries: 1

  # Model selection per tier (use cheapest model that works for each role)
  # Options: opus | sonnet | haiku
  models:
    control: sonnet       # COMMANDER, SCOREKEEPER, TRACKER, CHECKPOINT, STRATEGIST
    exploration: sonnet   # SCOUT, SYNTHESIZER, SAGE, CARTOGRAPHER, MODELER
    feasibility: sonnet   # GATEKEEPER, VALIDATOR
    solution: sonnet      # ARCHITECT, ORCHESTRATOR, SENTINEL
    specialists: sonnet   # INVESTIGATOR, GUARDIAN, ORACLE, BENCHMARK, ADVOCATE, MAVERICK
    build: sonnet         # IMPLEMENTER, SPEC GUARD, CODE REVIEWER, etc.
    learning: haiku       # MIRROR, ADAPTIVE, AUDITOR, REALIST (post-run, less critical)
    verification: opus    # VALIDATOR — most important check, use best model

  # Git worktree isolation for build tasks
  worktree_isolation:
    enabled: true
    # Each build task runs in isolated worktree, merges only when all gates pass
    cleanup_on_fail: true

  # Parallel thought branches for MAVERICK
  thought_branches:
    enabled: true
    max_branches: 3
    exploration_budget_per_branch: 5  # % of total token budget per branch

# =============================================================================
# RADAR — Real-time monitoring server
# =============================================================================

radar:
  # Enable/disable RADAR monitoring server
  # [default: true] Set false to disable automatic RADAR startup
  enabled: true

  # Port for RADAR SSE server
  # [range: 1024-65535] [default: 7891]
  # If port is in use, RADAR auto-increments until it finds an available port
  port: 7891

  # Record all SSE events to a JSONL file for later replay in the mock server
  # [default: false] Set true to enable recording.
  # Recording file: .specify/squad/radar-recording-{run_id}.jsonl
  record: false

  # Host binding
  # [default: localhost] Set to 0.0.0.0 to expose on LAN
  # host: localhost

# =============================================================================
# ANALYSIS SETTINGS
# =============================================================================

analysis:
  # Auto-detect greenfield vs brownfield
  mode: auto  # auto | greenfield | brownfield

  # Maximum squad iterations before forced convergence
  # [range: 3-10] Most runs converge in 2-3. Beyond 10 = likely stuck in a loop.
  # Setting to 99 wastes tokens - if not converged by 10, there's a deeper problem.
  max_iterations: 5

  # Token budget (approximate, in thousands)
  # [range: 100-2000] Purpose: prevent runaway costs and force convergence decisions.
  #
  # Q: "I have unlimited Claude tokens, should I set this very high?"
  # A: No. Even with unlimited tokens, high budgets (>2000k) lead to diminishing
  #    returns. The squad converges via quality gates and iteration limits anyway.
  #    A high budget just means slower convergence and more verbose output.
  #    Recommended: 500-1000k for most projects, 1500-2000k for very large codebases.
  # [disable: 999999] - effectively no budget limit (not recommended)
  token_budget_k: 1000

  # Convergence threshold for Understanding score delta
  # [range: 0.01-0.05] Smaller = stricter (more iterations), larger = looser.
  # Below 0.01 may never converge due to noise. Above 0.05 may stop too early.
  convergence_delta: 0.02

# Autonomy mode
# - guided: Checkpoint after every phase
# - semi: Checkpoint after Phase 1 only (default)
# - banzai: Full autonomous, human reviews final output
autonomy:
  mode: semi  # guided | semi | banzai

# =============================================================================
# CONVERGENCE RULES (COMMANDER)
# =============================================================================

convergence:
  # Quality delta threshold - stop if improvement < this
  # [range: 0.01-0.05] Same guidance as analysis.convergence_delta
  quality_delta_threshold: 0.02

  # Consecutive passes needed before declaring convergence
  # [range: 2-5] Higher = more confidence but slower. Beyond 5 = paranoid.
  consecutive_passes: 2

  # Escalate if same issue appears this many times
  # [range: 2-5] Lower = faster escalation, higher = more patient.
  issue_repeat_limit: 3

  # Maximum squad iterations (mirrors analysis.max_iterations)
  # [range: 3-10] See analysis.max_iterations for guidance.
  max_squad_iterations: 5

  # DEFER loop limit before forcing decision
  # [range: 1-3] How many times ASSESS can DEFER before forced PASS/KILL.
  defer_loop_limit: 2

# =============================================================================
# TOKEN BUDGET ALLOCATION (COMMANDER)
# =============================================================================

budget:
  # Phase 1 tier allocations (must sum to ~95%, leaving reserve)
  tier1_discover_what_percent: 25
  tier2_why_percent: 20
  tier3_how_specialists_percent: 25
  tier4_plan_assess_percent: 15
  tier5_consensus_finalize_percent: 10
  reserve_percent: 5

  # Max any single agent can consume
  max_single_agent_percent: 40

  # Budget exhaustion trigger
  exhaustion_threshold_percent: 100

# Build phase token budget allocation
build_budget:
  implementation_percent: 50
  quality_gates_percent: 30
  integration_percent: 15
  reserve_percent: 5

# =============================================================================
# TIME LIMITS
# =============================================================================

limits:
  # Wall-clock timeout for entire squad run (minutes)
  # [range: 20-90] Beyond 90 mins, something is likely stuck or looping.
  # [disable: 9999] - no timeout (not recommended for unattended runs)
  wall_clock_timeout_minutes: 40

# =============================================================================
# QUALITY GATES (SAGE, Understanding thresholds)
# =============================================================================

quality_gates:
  # WHY spec-validation mode thresholds (from Understanding CLI v3.6+)
  overall: 0.70
  structure: 0.70
  testability: 0.70
  semantic: 0.60
  cognitive: 0.60
  readability: 0.50
  depth: 0.30        # NEW in Understanding v3.6 — low bar initially, raise as baseline stabilizes

  # Margin for "borderline" warnings
  borderline_margin: 0.05

  # HIGH severity issues compound threshold
  high_compound_threshold: 3

# =============================================================================
# HEURISTICS (SAGE quality checks)
# =============================================================================

heuristics:
  # Max sentences per requirement
  max_requirement_sentences: 3

  # Max nesting depth in requirements
  max_nesting_depth: 3

  # Max words per sentence
  max_sentence_words: 25

# =============================================================================
# DISCOVERY SETTINGS (SCOUT)
# =============================================================================

discovery:
  # Git history lookback period
  git_history_lookback: "1 year ago"

  # Number of recent commits to analyze
  git_log_count: 50

  # Number of hotspots to display
  git_hotspots_count: 30

  # Minimum reference architectures for greenfield
  min_reference_architectures: 3

# =============================================================================
# SCORING (GATEKEEPER, SCOUT, AUDITOR)
# =============================================================================

scoring:
  # Confidence score range
  confidence_min: 0.0
  confidence_max: 1.0

  # Evidence grades (from most to least reliable)
  evidence_grades:
    - A  # Primary source, empirical
    - B  # Authoritative secondary
    - C  # General reference
    - D  # Expert opinion
    - E  # Speculation/inference

# =============================================================================
# RICE SCORING (GATEKEEPER)
# =============================================================================

rice:
  # Reach scale maximum
  reach_scale_max: 10

  # Impact scale values
  impact_scale_values:
    minimal: 0.25
    low: 0.5
    medium: 1
    high: 2
    massive: 3

  # Confidence scale values
  confidence_scale_values:
    low: 0.5
    medium: 0.8
    high: 1.0

# =============================================================================
# IMPLEMENTABILITY (GATEKEEPER)
# =============================================================================

implementability:
  # Number of failures before marking "blocked"
  blocked_failure_threshold: 3

# =============================================================================
# ASSESS SETTINGS (GATEKEEPER)
# =============================================================================

assess:
  # Maximum DEFER iterations before forcing decision.
  # MUST match convergence.defer_loop_limit — COMMANDER is the enforcement authority.
  # [authoritative key: convergence.defer_loop_limit]
  defer_max_iterations: 2

# =============================================================================
# CALIBRATION (AUDITOR)
# =============================================================================

calibration:
  # Accuracy below this triggers warning
  # [range: 0.3-0.7] Lower = more tolerant of bad estimates
  low_accuracy_threshold: 0.5

  # Trend variance threshold for "stable"
  trend_variance_stable: 0.05

  # Trend improvement threshold
  trend_improvement_threshold: 0.05

  # Minimum samples before calculating accuracy
  # [range: 3-10] Too low = noisy, too high = slow to learn
  min_sample_size: 3

  # Correction factor caps - how much AUDITOR can adjust estimates
  # [range: 0.3-0.8 for min, 2.0-5.0 for max]
  # Beyond 5x correction means estimates are essentially random - investigate root cause.
  correction_factor_min: 0.5
  correction_factor_max: 3.0

# =============================================================================
# RISK LEVELS (AUDITOR)
# =============================================================================

risk:
  # Accuracy thresholds for risk levels
  high_threshold: 0.5      # < this = HIGH risk
  medium_min: 0.5          # >= this AND < low_threshold = MEDIUM
  low_threshold: 0.75      # >= this = LOW risk

# =============================================================================
# METACOGNITION (MONITOR)
# =============================================================================

metacognition:
  # Check interval (every N tasks)
  check_interval_tasks: 5

  # Consecutive failures before signaling
  consecutive_fail_threshold: 3

  # Warning if no check for this many tasks
  max_tasks_without_check: 20

# =============================================================================
# INTERNALIZATION (VALIDATOR — legacy pass/partial/fail)
# =============================================================================

internalization_legacy:
  # Pass/partial/fail thresholds (out of 6 checks) — VALIDATOR's old binary check
  pass_threshold: 6
  partial_min: 4
  fail_below: 4

  # Estimated time for internalization
  estimated_time_minutes: 5

# =============================================================================
# INTERNALIZATION — Deterministic Metrics (AUDITOR, 16 metrics, 4 categories)
# =============================================================================
#
# Replaces the binary CHECKPOINT pass/partial/fail with 16 deterministic
# metrics across 4 categories: Absorption (I-01..I-04), int-Accuracy (I-05..I-08),
# int-Calibration (I-09..I-12), int-Transfer (I-13..I-16).
#
# AUDITOR computes these metrics; CHECKPOINT doubt scores are informational only.
# See .specify/specs/003-internalization-metrics/data-model.md for full schema.
#

internalization:
  # Master switch — set false to disable all internalization measurement
  enabled: true

  # ───────────────────────────────────────────────────────────────────────────
  # TIER CLASSIFICATION (FR-027)
  # Maps each of the 37 squad agents to an internalization tier.
  # Tiers determine which absorption and accuracy thresholds apply.
  # Every agent in agents.yaml MUST appear in exactly one tier.
  # ───────────────────────────────────────────────────────────────────────────
  tiers:
    deep:
      # Agents that must absorb the FULL spec — core builders and architects.
      # Highest thresholds: absorption >= 0.80, int-accuracy >= 0.75.
      agents: [IMPLEMENTER, ARCHITECT, ORCHESTRATOR, SENTINEL, CARTOGRAPHER, SCOUT, SAGE, SYNTHESIZER, GATEKEEPER, VALIDATOR]
      absorption_threshold: 0.80
      int_accuracy_threshold: 0.75
    moderate:
      # Agents that must absorb RELEVANT sections — reviewers, specialists, learning.
      # Medium thresholds: absorption >= 0.65, int-accuracy >= 0.60.
      agents: [INVESTIGATOR, GUARDIAN, ORACLE, BENCHMARK, ADVOCATE, MAVERICK, SPEC_GUARD, CODE_REVIEWER, TEST_GUARDIAN, DEBUGGER, INTEGRATOR, CHANGE_CONTROLLER, MIRROR, ADAPTIVE, AUDITOR, REALIST, MONITOR, MODELER, GOLDDIGGER]
      absorption_threshold: 0.65
      int_accuracy_threshold: 0.60
    minimal:
      # Task-oriented agents — trackers, scorekeepers, memory.
      # Low thresholds: absorption >= 0.40, int-accuracy >= 0.40.
      agents: [SCOREKEEPER, TRACKER, CHECKPOINT, STRATEGIST, PROGRESS_TRACKER, PROSPECTOR, VETERAN, GLOBAL_MEMORY]
      absorption_threshold: 0.40
      int_accuracy_threshold: 0.40
    exempt:
      # Not subject to internalization gate — orchestrator only.
      agents: [COMMANDER]

  # Fallback tier for any agent not listed above (FR-051)
  default_tier: deep

  # ───────────────────────────────────────────────────────────────────────────
  # CROSS-VALIDATION RULES (FR-041)
  # Detect metric combinations that suggest superficial compliance rather
  # than genuine internalization. Each rule fires a flag on the log entry.
  # ───────────────────────────────────────────────────────────────────────────
  cross_validation:
    CV-1:
      # High requirement coverage but low first-pass acceptance →
      # agent cites requirements without actually satisfying them.
      condition: "int_I01 >= 0.90 AND int_I13 < 0.50"
      flag: "high-coverage-low-acceptance"
      # Requires deferred metrics (I-13 is Transfer) — skipped during cold-start Phase 1
      requires_deferred: true
    CV-2:
      # High terminology fidelity but low numeric accuracy →
      # agent uses correct words but gets the numbers wrong.
      condition: "int_I03 >= 0.90 AND int_I05 < 0.80"
      flag: "high-terminology-low-accuracy"
      requires_deferred: false
    CV-3:
      # High requirement coverage but low terminology fidelity →
      # agent copies requirement IDs without understanding the domain language.
      condition: "int_I01 >= 0.90 AND int_I03 < 0.40"
      flag: "citation-stuffing-low-fidelity"
      requires_deferred: false

  # ───────────────────────────────────────────────────────────────────────────
  # COLD-START PROTOCOL (FR-048)
  # Governs metric availability during early runs when historical data
  # is insufficient for deferred metrics (calibration, transfer).
  # ───────────────────────────────────────────────────────────────────────────
  cold_start:
    # Phase 1 (runs 1-4): Only immediate metrics (I-01..I-08) computed.
    # Deferred metrics (I-09..I-16) are null. Gate uses absorption only.
    phase_1_max_runs: 4

    # Phase 2 (runs 5-9): Deferred metrics begin populating as data accrues.
    # Gate uses absorption + available deferred metrics.
    phase_2_max_runs: 9

    # Brier Score (I-09) requires at least this many confidence-outcome pairs.
    # Below this count, I-09 remains null.
    brier_min_pairs: 5

    # Escalation precision (I-12) requires at least this many escalation events.
    # Below this count, I-12 remains null.
    escalation_min_count: 3

    # Promotion to "stable" status requires this many completed runs.
    # Below this, entry is tagged run_type: validation_run.
    promotion_min_runs: 20

    # Minimum prompt-version correlation (Spearman) before ADAPTIVE
    # can recommend prompt changes based on internalization trends.
    # [range: 0.50-0.90] Higher = more conservative recommendations.
    promotion_correlation_threshold: 0.70

  # ───────────────────────────────────────────────────────────────────────────
  # DISAGREEMENT PROTOCOL (FR-032)
  # Detects when CHECKPOINT doubt scores conflict with AUDITOR metrics.
  # ───────────────────────────────────────────────────────────────────────────
  disagreement:
    # If AUDITOR metrics PASS but CHECKPOINT recorded >= this many critical
    # doubts, flag the entry with disagreement_flag: "metrics-pass-doubts-high".
    critical_doubt_threshold: 2

  # ───────────────────────────────────────────────────────────────────────────
  # DIAGNOSTIC MATRIX (FR-039)
  # Combines Understanding score (U) with internalization score (I) to
  # classify outcomes into four quadrants:
  #   U-high + I-high = aligned
  #   U-high + I-low  = confounded (spec is good but agent doesn't absorb)
  #   U-low  + I-high = compensating (agent absorbs despite poor spec)
  #   U-low  + I-low  = systemic (both spec quality and absorption are low)
  # ───────────────────────────────────────────────────────────────────────────
  diagnostic_matrix:
    # Threshold above which Understanding score is considered "high"
    understanding_high_threshold: 0.70
    # Threshold above which internalization score is considered "high"
    internalization_high_threshold: 0.70

  # ───────────────────────────────────────────────────────────────────────────
  # EVOLUTION SIGNALS — Internalization-specific (FR-052..FR-055)
  # Extends the existing evolution.signals section with int-specific triggers.
  # AUDITOR fires these when internalization metrics show sustained decline.
  # ───────────────────────────────────────────────────────────────────────────
  evolution_signals:
    # Minimum consecutive runs with declining metrics before signal fires.
    # [range: 2-5] Lower = more sensitive, higher = fewer false alarms.
    min_consecutive_runs: 3

    # Severity is mapped from the magnitude of decline (peak - current).
    # Each threshold is the minimum decline delta for that severity level.
    severity_thresholds:
      low: 0.10       # 10-19% decline from peak
      medium: 0.20    # 20-29% decline from peak
      high: 0.30      # 30-39% decline from peak
      critical: 0.40  # 40%+ decline from peak

# =============================================================================
# EVOLUTION (AUDITOR + ADAPTIVE)
# =============================================================================

evolution:
  # Master switch for the evolution learning loop
  # [disable: false] Disables evolution signals and recommendations
  enabled: true

  signals:
    # Trigger evolution signal when accuracy drops this much from best-known value
    # [range: 0.05-0.2] Lower = more sensitive, higher = fewer false alarms
    regression_delta: 0.1

    # Minimum runs before any evolution signal can fire
    # [range: 3-10] Prevents premature signals from limited run history
    min_sample_size: 5

    # Consecutive declining runs before declining_trend signal fires
    # [range: 2-5]
    declining_trend_runs: 3

    # Same pitfall triggered N times before recurring_pitfall signal fires
    # [range: 2-5]
    recurring_pitfall_count: 3

    # Same agent rejected N times for same reason before recurring_rejection signal fires
    # [range: 2-5]
    recurring_rejection_count: 3

  recommendations:
    # Minimum correlated data points for ADAPTIVE to produce a recommendation
    # [range: 2-5] 3 = HIGH confidence (recommended), 2 = MEDIUM, 1 = LOW (noisy)
    min_confidence: 3

    # Require downstream outcome evidence (doubt->rework chain) for recommendations
    # [disable: false] Allows recommendations based on accuracy alone (less reliable)
    require_downstream_evidence: true

# =============================================================================
# CODE QUALITY (CODE-REVIEWER)
# =============================================================================

code_quality:
  # Maximum function length (lines)
  # [range: 20-50] Industry standard ~30. Setting to 500 defeats the purpose.
  # [disable: 9999] - no limit (not recommended)
  max_function_lines: 30

  # Maximum nesting depth
  # [range: 2-5] Deep nesting (>5) is almost always refactorable.
  max_nesting_depth: 3

  # Maximum cyclomatic complexity
  # [range: 5-15] Research shows >10 correlates with defects.
  # [disable: 9999] - no limit (not recommended)
  max_cyclomatic_complexity: 10

# =============================================================================
# TEST REQUIREMENTS (TEST-GUARDIAN)
# =============================================================================

tests:
  # Minimum tests by component type
  # [range: 1-10 each] These are minimums - actual tests may be more.
  # Setting all to 1 = minimal coverage. Setting all to 10 = thorough but slow.
  min_pure_function: 2
  min_class_service: 3
  min_ui_component: 3
  min_composite_component: 4
  min_api_endpoint: 4
  min_integration: 2

# =============================================================================
# DRIFT DETECTION (PROGRESS-TRACKER)
# =============================================================================

drift:
  # Single task overrun ratio trigger
  single_task_overrun_ratio: 2.0

  # Consecutive overrun settings
  consecutive_overrun_count: 3
  consecutive_overrun_ratio: 1.5

  # Phase overrun threshold
  phase_overrun_ratio: 1.3

  # Systematic bias detection
  systematic_bias_percent: 50
  systematic_bias_ratio: 1.2

  # Minimum tasks before drift detection kicks in
  min_sample_size: 3

# =============================================================================
# QUALITY METRICS (PROGRESS-TRACKER)
# =============================================================================

quality:
  # Target review cycle time
  target_review_cycles: 2.0

# =============================================================================
# ALERTS (PROGRESS-TRACKER)
# =============================================================================

alerts:
  # Schedule Performance Index threshold
  schedule_drift_spi: 0.85

  # Cost Performance Index threshold
  cost_overrun_cpi: 0.80

  # First-pass rate warning threshold
  quality_first_pass_min_percent: 50
  quality_warning_task_window: 4

  # Defect spike detection
  defect_spike_percent: 60
  defect_spike_task_window: 3

  # Architecture erosion threshold
  architecture_erosion_threshold: 2

  # Improving trend detection
  improving_trend_count: 3

# =============================================================================
# BUILD SETTINGS
# =============================================================================

build:
  # NEEDS_CONTEXT re-dispatch limit
  needs_context_max_retries: 2

  # Fix cycle limit before escalation
  fix_cycle_limit: 2

  # Tasks blocked before pausing build
  blocked_tasks_pause_threshold: 3

  # Per-task quality gate sequence (agents run in this order)
  gate_sequence: [SPEC_GUARD, CODE_REVIEWER, TEST_GUARDIAN]

  # Phase gate agents (run at each phase checkpoint)
  phase_gate: [INTEGRATOR, VALIDATOR]

  # MONITOR (metacognition) frequency (every N tasks)
  metacognition_frequency: 5

  # MODELER invariant checking (every N tasks or per task)
  # [range: 1-10] 1 = every task, 5 = every 5th task
  invariant_check_frequency: 1

  # VALIDATOR (backpropagation) settings
  verification:
    max_passes: 3
    target_coverage: 100
    minimum_coverage: 95

  # Visual validation (if VISUAL VALIDATOR is added)
  visual_validation:
    enabled: false
    checkpoints: [per_phase, before_complete]
    browser: chromium

# =============================================================================
# SPECIALIST SETTINGS
# =============================================================================

specialists:
  # Max active specialists per run (to control token cost)
  max_active: 3

  # Always summon TEST ARCHITECT (SENTINEL)
  always_test_architect: true

  # Auto-summon SCIENTIST (INVESTIGATOR) for unknowns
  auto_scientist: true

  # GUARDIAN dispatch mode
  # - always_on: GUARDIAN runs on every squad run (Minimum Security Checklist for non-security
  #   domains, full STRIDE/OWASP for security domains). Does not count toward max_active cap.
  # - on_demand: GUARDIAN only dispatched when security domain keywords detected (legacy).
  # [default: always_on]
  guardian_mode: always_on

  # Auto-summon SECURITY (GUARDIAN) when these keywords appear in spec (on_demand mode only)
  auto_security_keywords:
    - auth
    - login
    - password
    - token
    - PII
    - payment
    - encrypt
    - GDPR
    - HIPAA
    - compliance

  # Auto-summon PERFORMANCE (BENCHMARK) when these keywords appear
  auto_performance_keywords:
    - real-time
    - concurrent
    - throughput
    - latency
    - scalab
    - high-load

# =============================================================================
# KNOWLEDGE BASE
# =============================================================================

knowledge_base:
  # Pruning: entries older than this (months) flagged stale
  stale_threshold_months: 6

  # Pruning: accuracy below this flagged low_confidence
  low_confidence_threshold: 0.4

  # Max active entries per file
  max_entries: 200

# =============================================================================
# TOOL PATHS
# =============================================================================

tools:
  understanding_cli: "understanding"
  # reverse-eng is a Claude Code skill (not a CLI).
  # Invoke via: Skill tool → speckit.reverse-eng.extract / speckit.reverse-eng.analyze
  # No CLI path needed.

# =============================================================================
# BANZAI MODE (Full Autonomous)
# =============================================================================

banzai:
  # Pull defaults from installed presets (optional)
  constitution_preset: null

  # Inline defaults for Phase 2 decisions
  defaults:
    team_size: 1
    tech_stack: "infer"
    timeline: "flexible"

  # Safety rails (scores are 0.0-1.0)
  auto_kill_threshold: 0.3

  # Conditions that force human checkpoint even in banzai mode
  require_human_if:
    - "compliance requirements detected"
    - "security-critical domain"
    - "ASSESS confidence < 0.5"

# =============================================================================
# ENDOCRINE SYSTEM — Hormone-modulated agent motivation
# =============================================================================
#
# Bio-inspired neuromodulator system that dynamically adjusts agent behavior
# based on budget pressure, task complexity, and run phase.
#
# Phase 1: Adrenaline only (urgency signal)
# Phase 2: Four neuromodulators (dopamine, cortisol, serotonin, norepinephrine)
# Phase 3: Full six hormones
# Phase 4: Adaptive baselines from run history
#

endocrine:
  enabled: true  # Enabled by default; set to false to disable all endocrine mutations
  phase: 1  # 1=adrenaline only, 2=four neuromodulators, 3=full 6, 4=adaptive

  # Adrenaline triggers (Phase 1)
  adrenaline:
    budget_threshold: 0.80  # Trigger at 80% budget consumed
    budget_boost: 0.2       # +0.2 adrenaline when triggered
    task_complexity_low: 0.3  # Adrenaline for simple tasks
    task_complexity_high: 0.7  # Adrenaline for complex tasks

  # Baseline per archetype (all 6 hormones, but only adrenaline used in Phase 1)
  # Order: [adrenaline, dopamine, cortisol, serotonin, oxytocin, norepinephrine]
  baselines:
    exploration: [0.4, 0.5, 0.4, 0.5, 0.5, 0.3]
    validation: [0.3, 0.5, 0.7, 0.5, 0.4, 0.6]
    feasibility: [0.5, 0.5, 0.6, 0.5, 0.5, 0.5]
    solution: [0.5, 0.5, 0.5, 0.6, 0.5, 0.5]
    build: [0.6, 0.5, 0.5, 0.5, 0.6, 0.8]
    innovation: [0.3, 0.5, 0.3, 0.5, 0.5, 0.2]
    learning: [0.3, 0.5, 0.5, 0.7, 0.6, 0.4]
    control: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

  # Circuit breakers
  circuit_breakers:
    max_change_per_cycle: 0.3
    ceiling: 1.0
    floor: 0.0
    consecutive_extreme_reset: 3  # Reset after 3 cycles at ceiling/floor

  # Decay rates (per dispatch cycle)
  decay:
    adrenaline: 0.7
    dopamine: 0.8
    cortisol: 0.85
    serotonin: 0.95
    oxytocin: 0.9
    norepinephrine: 0.75
