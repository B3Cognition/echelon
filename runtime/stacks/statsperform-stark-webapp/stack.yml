schema_version: "1.0"
stack:
  id: statsperform-stark-webapp
  name: Stats Perform Stark Web App
  version: "1.0.0"
  kind: archetype
  owner: statsperform
  description: Opta Stark Nx/Next.js web-app archetype with Stats Perform web delivery conventions.
applies_to:
  archetypes:
    - web_app
provides:
  web_app.template: opta-stark
  web_app.framework: nextjs
  web_app.workspace: nx
  web_app.runtime: node
  delivery.web_app: stark-default
  observability.web_app: stark-default
  test.frontend: jest-rtl
implies:
  - statsperform-playbook
requires:
  commands:
    - npm
    - npx
  registries:
    - statsperform-nexus
detection:
  positive:
    technologies:
      - stark
      - opta-stark
    dependencies:
      - "@statsperform/opta-stark"
    files:
      - stark.config.yml
  modernization:
    technologies:
      - nextjs
      - nx
      - react
    dependencies:
      - "@statsperform/react-playbook"
tools:
  nx:
    type: cli
    command: npx
    args:
      - nx
    phase_scope:
      - spec
      - delivery
    purpose: Nx project graph, dev, build, lint, and test tasks for Stark web apps.
    commands:
      build_web:
        args: ["build", "web"]
        output: text
        gate: true
      lint_web:
        args: ["lint", "web"]
        output: text
        gate: true
      test_web:
        args: ["test", "web"]
        output: text
        gate: true
context:
  files:
    - context.md
conflicts: []
