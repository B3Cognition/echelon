schema_version: "1.4"
stack:
  id: browser-3d-game
  name: Browser 3D Game
  version: "1.0.0"
  kind: archetype
  owner: echelon
  description: Browser-first 3D game client using React, Three.js, and React Three Fiber.
applies_to:
  archetypes:
    - browser_3d_game
provides:
  web_app.framework: vite-react
  web_app.rendering: react-three-fiber
  web_app.workspace: pnpm
  test.frontend: vitest-playwright
  delivery.web_app: docker-web
  x.game.client_runtime: browser-3d
implies: []
requires:
  commands:
    - pnpm
runnability:
  classification: user_facing
  policy: required
  runner: linux_container
  capabilities:
    - install
    - provision
    - start
    - readiness
    - primary_journey
    - stop
  required_observations:
    - browser_dom
  local_runner:
    profiles:
      - macos-compose-v1
coverage_observers:
  - id: playwright-e2e
    test_types:
      - e2e
    command: >-
      mkdir -p "$(dirname "$ECHELON_COVERAGE_REPORT")" &&
      pnpm exec playwright test --reporter=json > "$ECHELON_COVERAGE_REPORT"
    report_path: .echelon/coverage-reports/playwright.json
    adapter: playwright-json
    mode: isolated
    required: true
  - id: vitest-core
    test_types:
      - unit
      - integration
      - contract
    command: >-
      mkdir -p "$(dirname "$ECHELON_COVERAGE_REPORT")" &&
      pnpm exec vitest run --reporter=json --outputFile="$ECHELON_COVERAGE_REPORT"
    report_path: .echelon/coverage-reports/vitest.json
    adapter: vitest-json
    mode: isolated
    required: true
detection:
  positive:
    technologies:
      - threejs
      - react-three-fiber
    dependencies:
      - three
      - "@react-three/fiber"
      - "@react-three/drei"
    files:
      - package.json
context:
  files:
    - context.md
conflicts: []
