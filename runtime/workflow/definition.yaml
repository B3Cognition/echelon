# REOPEN — read by echelon spec reopen
# COMMANDER contract: mutate only spec artifacts to convert verified fulfillment
# gaps into harness-ready follow-up work.
# =============================================================================
reopen:

  phases:

    - id: reopen-1-apply-gaps
      label: "Apply Fulfillment Gaps"
      spec_file: workflow/phases/reopen-1-apply-gaps.md
      type: commander_internal
      transitions:
        - to: DONE
          condition: always
