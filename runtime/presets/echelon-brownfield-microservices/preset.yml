schema_version: "1.0"

preset:
  id: "echelon-brownfield-microservices"
  name: "Microservices Migration"
  version: "1.0.0"
  description: "Templates optimized for decomposing monoliths into microservices using DDD patterns"
  author: "Michal Bachorik"
  repository: "https://github.com/B3Cognition/echelon"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"
  extensions:
    - id: "echelon"
      version: ">=2.1.0"

provides:
  templates:
    # Strategic artifact templates
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Constitution with microservices architecture principles"
      replaces: "constitution-template"

    - type: "template"
      name: "migration-strategy-template"
      file: "templates/migration-strategy-template.md"
      description: "Migration strategy with service decomposition focus"
      replaces: "migration-strategy-template"

    - type: "template"
      name: "domain-spec-template"
      file: "templates/domain-spec-template.md"
      description: "Domain spec with bounded context and API contract sections"
      replaces: "domain-spec-template"

    - type: "template"
      name: "gap-analysis-template"
      file: "templates/gap-analysis-template.md"
      description: "Gap analysis with distributed systems considerations"
      replaces: "gap-analysis-template"

    # Pre-populated ADR templates
    - type: "template"
      name: "adr-service-boundaries"
      file: "adrs/001-service-boundaries-template.md"
      description: "ADR template for defining service boundaries"

    - type: "template"
      name: "adr-communication-patterns"
      file: "adrs/002-communication-patterns-template.md"
      description: "ADR template for inter-service communication"

    - type: "template"
      name: "adr-data-ownership"
      file: "adrs/003-data-ownership-template.md"
      description: "ADR template for database per service decisions"

tags:
  - "microservices"
  - "ddd"
  - "decomposition"
  - "api"
  - "distributed-systems"
